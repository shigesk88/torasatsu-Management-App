:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ic.sm{width:16px;height:16px;vertical-align:-3px}
[hidden]{display:none!important}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(6,9,17,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand img{height:28px;width:auto;filter:brightness(0) invert(1)}
.brand b{display:block;font-family:var(--f-num);font-weight:800;font-size:15px;letter-spacing:.16em;line-height:1.2}
.brand small{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.bar .sp{flex:1 1 0;min-width:0}
.who{display:flex;gap:8px;align-items:center;min-width:0;font-size:13px;font-weight:700}
.who select{background:var(--surface-2);border:1px solid var(--line-hi);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;max-width:100%;min-width:0;box-shadow:var(--raise-sm)}

main{padding-block:18px 56px;display:grid;gap:16px}
.panel{background:linear-gradient(180deg,var(--surface-hi),var(--surface) 60%);border:1px solid var(--line);border-top-color:var(--line-hi);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--raise)}
h2{font-size:18px;font-weight:700;line-height:1.4;margin:0;display:flex;align-items:center;gap:8px;text-wrap:balance}
h2 .ic{color:var(--accent-hi)}
h2 .kt .ic{color:inherit}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.label{font-size:13px;color:var(--muted)}
.note{background:var(--surface-2);border:1px dashed var(--line-hi);color:var(--muted);border-radius:12px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{color:var(--muted);font-size:14px;padding:22px 8px;text-align:center;line-height:1.8}

/* 継続 / 単発 */
.kt{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:2px 9px 2px 7px;border-radius:999px;white-space:nowrap;line-height:1.5}
.kt .ic{width:13px;height:13px;stroke-width:2.4;vertical-align:0}
.kt-m{background:var(--stock);color:var(--stock-on)}
.kt-o{color:var(--once);box-shadow:inset 0 0 0 1.5px var(--once)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;line-height:1.5}
.badge .ic{width:13px;height:13px;stroke-width:2.3;vertical-align:0}
.b-paid{background:var(--good-soft);color:var(--good)}
.b-due{background:var(--bad-soft);color:var(--bad)}
.b-wait{background:var(--surface-2);color:var(--muted)}
.b-pending{background:var(--accent-soft);color:var(--accent-hi)}
.b-end{background:var(--surface-2);color:var(--faint)}

/* hero (referrer) */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:24px 22px 26px;display:grid;gap:10px;min-height:250px;align-content:end;
  background:linear-gradient(100deg,rgba(6,9,17,.9) 0%,rgba(6,9,17,.55) 50%,rgba(6,9,17,.1) 100%),linear-gradient(160deg,rgba(28,86,196,.35),rgba(6,9,17,0) 60%),linear-gradient(0deg,rgba(6,9,17,.75),transparent 55%),var(--hero-img) center 30%/cover no-repeat,#0B1220;
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 40px -16px rgba(0,0,0,.9)}
.hero>*{position:relative}
.hero .hi{font-size:14px;font-weight:700;color:#D6DDE8}
.hero .nm{font-size:clamp(22px,5.4vw,28px);font-weight:700;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.hero .cap{font-size:13px;font-weight:700;color:var(--accent-cyan);letter-spacing:.06em;margin-top:6px}
.big{font-family:var(--f-num);font-weight:800;font-size:clamp(46px,12vw,72px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;background:linear-gradient(95deg,#FFFFFF,var(--accent-hi) 55%,var(--accent-cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(61,139,255,.35))}
.big .yen{font-size:.5em;margin-right:4px;-webkit-text-fill-color:var(--muted)}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero .chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:rgba(6,9,17,.6);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-weight:800;font-family:var(--f-num)}
.hero .state{font-size:13px;font-weight:700;color:#D6DDE8;display:flex;align-items:center;gap:6px}
.hero .state.paid{color:var(--good)}

/* stat cards */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{display:grid;gap:6px;align-content:start}
.stat .t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.stat .t .ic{color:var(--accent-hi)}
.stat .v{font-family:var(--f-num);font-weight:800;font-size:clamp(26px,6vw,34px);line-height:1.1;letter-spacing:-.02em}
.stat .s{font-size:12px;color:var(--muted)}
.stat.cumu .v{color:var(--accent-hi)}
.stat.stk .v{color:var(--stock-ink)}

/* chart */
.seg{display:inline-flex;background:var(--field);border:1px solid var(--line-hi);border-radius:999px;padding:3px;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 2px 8px -2px rgba(61,139,255,.6)}
svg.chart{display:block;width:100%;height:auto}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}

/* list rows (deals, payments) */
.rows{display:grid;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px;border-radius:14px;background:linear-gradient(180deg,#1C253A,#151C2D);border:1px solid var(--line);box-shadow:var(--raise-sm)}
.item.click{cursor:pointer;text-align:left;width:100%}
.item.click:hover{border-color:var(--accent)}
.item .main{min-width:0}
.item .main b{display:block;font-size:16px;line-height:1.4}
.item .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.item .amt{text-align:right;display:grid;justify-items:end;gap:4px}
.item .amt b{font-family:var(--f-num);font-size:18px;font-weight:800}
.item .amt .per{font-size:11px;color:var(--muted);font-weight:700}
.item.m .amt b{color:var(--stock-ink)} .item.o .amt b{color:var(--once-ink)}
.item.dim{opacity:.55}
.item .act{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:6px}

/* admin */
.tabs{display:flex;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:16px;padding:5px;box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:none;padding:11px 8px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,#5FA3FF,#2F78EE);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 16px -6px rgba(61,139,255,.7)}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav button{border:1px solid var(--line-hi);background:var(--surface-2);width:38px;height:38px;border-radius:10px;cursor:pointer;display:grid;place-items:center;box-shadow:var(--raise-sm)}
.monthnav b{font-size:16px;font-weight:700;min-width:7em;text-align:center}
.monthnav .today{width:auto;padding:0 12px;font-size:13px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.kpi{padding:14px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--raise-sm)}
.kpi .v{font-family:var(--f-num);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.kpi.good .v{color:var(--good)} .kpi.bad .v{color:var(--bad)}
form.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-items:end}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-hi);background:var(--field);padding:11px 12px;border-radius:10px;font-size:15px;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:inset 0 2px 4px rgba(0,0,0,.4),0 0 0 3px var(--accent-soft)}
.field.wide{grid-column:1/-1}
.pair{display:grid;grid-template-columns:auto 1fr;gap:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-hi);background:linear-gradient(180deg,#24304A,#1B2439);padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;min-height:42px;color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 0 #05070D,0 6px 12px -4px rgba(0,0,0,.6);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 0 #05070D}
.btn.primary{background:linear-gradient(180deg,#5FA3FF,#2F78EE);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 var(--accent-deep),0 8px 22px -6px rgba(61,139,255,.45)}
.btn.primary:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 var(--accent-deep)}
.btn.good{background:linear-gradient(180deg,#5BE8A0,#2FC77A);color:#04140B;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 #1C8A53}
.btn.danger{color:var(--bad);background:var(--bad-soft);border-color:transparent;box-shadow:none}
.btn.small{padding:6px 12px;font-size:13px;min-height:36px;border-radius:10px}
.btn.ghost{background:none;box-shadow:none;border-color:var(--line-hi)}
.btn:disabled{opacity:.3;cursor:default}

.grph{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;padding:0 2px 2px;border-bottom:1px solid var(--line)}
.grph>b{font-size:17px}
.grph .label b{font-size:14px;color:var(--ink);font-family:var(--f-num)}
.sectitle{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:linear-gradient(180deg,#4B93FF,#2F78EE);color:#fff;border-radius:14px;padding:12px 18px;font-size:14px;font-weight:800;z-index:20;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.6)}

const addM = (ym, n) => { let [y, m] = ym.split("-").map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return y + "-" + pad(m); };

};

const kindTag = k => k === "once" ? `<span class="kt kt-o">${ic("bolt")}単発・1回</span>` : `<span class="kt kt-m">${ic("loop")}継続・毎月</span>`;
const STATUS = { won: "成約", pending: "商談中", lost: "終了" };

/* ---------- 紹介料の計算 ----------
   継続: 月額 × 率（または固定額）を開始月〜終了月の毎月
   単発: 受注金額 × 率（または固定額）を計上月に1回
   商談中は入れない。初期値は 紹介者ごとの設定 → 商材の標準 */
const filled = v => v !== null && v !== undefined && v !== "" && !Number.isNaN(Number(v));
const qtyOf = d => Math.max(1, Math.floor(Number(d.qty) || 1));
/* 1契約（1名）あたりの紹介料 × 数量 */
const rewardOf = d => qtyOf(d) * (d.rewardType === "fixed" ? Math.floor(Number(d.fixed) || 0) : Math.floor((Number(d.amount) || 0) * (Number(d.rate) || 0) / 100));
const ruleOfDeal = x => x.rewardType === "fixed" ? `固定 ${yen(x.fixed)}` : `${yen(x.amount)} × ${x.rate}%`;
function productRule(p) {
  if (!p) return null;
  if (p.rewardType === "fixed") return filled(p.fixed) ? { rewardType: "fixed", fixed: Number(p.fixed) } : null;
  if (p.rewardType === "none") return null;
  return filled(p.rate) ? { rewardType: "rate", rate: Number(p.rate) } : null;
}
function repRule(rep, pid) {
  const o = rep?.rates?.[pid]; if (!o) return null;
  if (o.rewardType === "fixed") return filled(o.fixed) ? { rewardType: "fixed", fixed: Number(o.fixed) } : null;
  return filled(o.rate) ? { rewardType: "rate", rate: Number(o.rate) } : null;
}
const defaultRule = (repId, p) => { const r = repRule(repOf(repId), p?.id); return r ? { ...r, src: "rep" } : (productRule(p) ? { ...productRule(p), src: "product" } : null); };
const ruleText = r => !r ? "案件ごと" : r.rewardType === "fixed" ? yen(r.fixed) : r.rate + "%";
function activeIn(d, ym) {
  if (d.status === "pending" || !d.startMonth) return false;
  if (d.kind === "once") return d.startMonth === ym;
  return d.startMonth <= ym && (!d.endMonth || ym <= d.endMonth);
}
function monthTotals(deals, ym) { let stock = 0, once = 0; for (const d of deals) if (activeIn(d, ym)) d.kind === "once" ? once += rewardOf(d) : stock += rewardOf(d); return { stock, once, total: stock + once }; }

/* ---------- 支払い ----------
   payments/<YYYY-MM>_<紹介者id> は「支払い済み」を押したときだけ作る（金額はその時点で確定） */
const payId = (ym, repId) => ym + "_" + repId;
const paidOf = (repId, ym) => { const p = data().payments.find(x => x.id === payId(ym, repId)); return p && p.paid ? p : null; };
const dealsOf = repId => data().deals.filter(x => x.repId === repId);
function repMonth(repId, ym) { const p = paidOf(repId, ym); return p ? { stock: +p.stock || 0, once: +p.once || 0, total: +p.total || 0, paid: p } : { ...monthTotals(dealsOf(repId), ym), paid: null }; }
const firstMonth = repId => (repId ? dealsOf(repId) : data().deals).map(x => x.startMonth).filter(Boolean).sort()[0];
function monthsUntilNow(repId) { const out = [], s = firstMonth(repId); if (!s) return out; for (let m = s, n = 0; m <= nowYM && n < 240; m = addM(m, 1), n++) out.push(m); return out; }

    ["r2", "p1", "サンプル花屋", 50000, m(-3)], ["r2", "p4", "サンプル保険代理店", 150000, m(-1)],
  ];
  const deals = rows.map((x, i) => { const p = products.find(q => q.id === x[1]); return { id: "d" + i, repId: x[0], productId: x[1], kind: p.kind, client: x[2], amount: x[3], startMonth: x[4], rewardType: "rate", rate: p.rate, fixed: 0, status: x[5] || "won", endMonth: "", note: "" }; });
  const payments = [];
  for (let k = -8; k <= -2; k++) for (const r of reps) {
    const t = monthTotals(deals.filter(d => d.repId === r.id), m(k)); if (!t.total) continue;
    payments.push({ id: payId(m(k), r.id), ym: m(k), repId: r.id, ...t, paid: true, paidDate: m(k + 1) + "-10" });
  }
  return { products, reps, deals, payments };
})();

/* ---------- Firebase ---------- */
const fbApp = FIREBASE_CONFIG ? initializeApp(FIREBASE_CONFIG) : null;
const auth = fbApp ? getAuth(fbApp) : null;
const fs = fbApp ? getFirestore(fbApp) : null;
const loginEmail = id => `${String(id).trim().toLowerCase()}@${ID_DOMAIN}`;
const ID_OK = /^[a-z0-9][a-z0-9._-]{2,29}$/;
const wrapSnap = s => ({ docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })) });
const fdb = {
  collection: (name, ...conds) => ({
    onSnapshot: (cb, err) => onSnapshot(conds.length ? query(collection(fs, name), ...conds.map(c => where(...c))) : collection(fs, name), s => cb(wrapSnap(s)), err),
    add: body => addDoc(collection(fs, name), body),
  }),
  doc: path => ({ set: body => setDoc(doc(fs, path), body), delete: () => deleteDoc(doc(fs, path)) }),
};
const genPw = () => { const c = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const a = new Uint32Array(10); crypto.getRandomValues(a); return [...a].map(n => c[n % c.length]).join(""); };
const suggestId = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); return "tora" + String(1000 + a[0] % 9000); };

/* ---------- state ---------- */
const S = {
  db: null, user: null, uid: null, isAdmin: false, demo: false, loaded: { products: false, reps: false, deals: false, payments: false },
  products: [], reps: [], deals: [], payments: [], myRepId: null, phase: "loading", authUser: null, adminLoginId: "", subs: {}, issued: null,
  view: "rep", viewRepId: null, repTab: "fee", tab: "pay", dealRep: "", dealForm: false, month: nowYM, chart: "month",
  editDeal: null, editRep: null, editProduct: null, confirmDel: null, busy: false,
};
const data = () => S.demo ? DEMO : S;
const prodOf = id => data().products.find(p => p.id === id);
const repOf = id => data().reps.find(r => r.id === id);
const byOrder = (a, b) => (a.order ?? 9999) - (b.order ?? 9999) || String(a.name).localeCompare(String(b.name), "ja");

async function save(col, id, body, quiet) {
  if (S.demo || !S.db) {
    const arr = DEMO[col]; id = id || col[0] + Date.now();
    const i = arr.findIndex(x => x.id === id); i >= 0 ? arr[i] = { ...body, id } : arr.push({ ...body, id });
    if (!quiet) render(); return true;
  }
  try {
    body = { ...body, updatedAt: new Date().toISOString() };
    if (id) await S.db.doc(col + "/" + id).set(body); else await S.db.collection(col).add(body);
    return true;
  } catch (e) {
    toast(e?.code === "permission-denied" ? "保存する権限がありません" : "保存できませんでした。通信状況を確認してもう一度お試しください");
    return false;
  }
}
async function remove(col, id) {
  if (S.demo || !S.db) { DEMO[col] = DEMO[col].filter(x => x.id !== id); render(); return true; }
  try { await S.db.doc(col + "/" + id).delete(); return true; } catch { toast("削除できませんでした"); return false; }
}

/* ---------- boot ---------- */
function sub(col, conds) {
  try { S.subs[col]?.(); } catch {}
  S.loaded[col] = false;
  S.subs[col] = fdb.collection(col, ...conds).onSnapshot(snap => {
    S[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (col === "products") S.products.sort(byOrder);
    S.loaded[col] = true; render.keep = true; render();
  }, e => { console.warn(col, e?.code); S.loaded[col] = true; render(); });
}
function stopSubs() { for (const k of Object.keys(S.subs)) { try { S.subs[k](); } catch {} } S.subs = {}; }
async function readSetup() { try { const d = await getDoc(doc(fs, "meta/setup")); return d.exists() ? d.data() : null; } catch { return null; } }

(async function boot() {
  render();
  if (!fbApp) { S.demo = true; S.isAdmin = true; S.view = "admin"; S.phase = "app"; render(); return; }
  S.db = fdb;
  try { await setPersistence(auth, browserLocalPersistence); } catch {}
  onAuthStateChanged(auth, async user => {
    stopSubs();
    Object.assign(S, { authUser: user, products: [], reps: [], deals: [], payments: [], myRepId: null, isAdmin: false, issued: null, editDeal: null, editRep: null, editProduct: null });
    if (!user) { S.phase = (await readSetup()) ? "login" : "setup"; render(); return; }
    S.phase = "loading"; render();
    const setup = await readSetup();
    S.isAdmin = !!setup && setup.adminUid === user.uid;
    S.adminLoginId = S.isAdmin ? setup.adminLoginId || "" : "";
    S.loaded = { products: false, reps: false, deals: false, payments: false };
    if (S.isAdmin) { S.view = "admin"; ["products", "reps", "deals", "payments"].forEach(c => sub(c, [])); }
    else {
      S.view = "rep"; S.repTab = "fee"; sub("products", []);
      S.subs.reps = fdb.collection("reps", ["uid", "==", user.uid]).onSnapshot(snap => {
        S.reps = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded.reps = true;
        const id = S.reps[0]?.id || null;
        if (id !== S.myRepId || !S.subs.deals) {
          S.myRepId = id;
          if (id) { sub("deals", [["repId", "==", id]]); sub("payments", [["repId", "==", id]]); } else { S.loaded.deals = S.loaded.payments = true; }
        }
        render.keep = true; render();
      }, () => { S.loaded.reps = S.loaded.deals = S.loaded.payments = true; render(); });
    }
    S.phase = "app"; render();
  });
})();

/* ---------- render ---------- */
function render() {
  renderWho();
  const app = $("#app");
  if (S.phase === "setup" || S.phase === "login") { app.innerHTML = authHTML(); bindAuth(); return; }
  const loading = S.phase === "loading" || (!S.demo && !Object.values(S.loaded).every(Boolean));
  if (loading) { app.innerHTML = `<div class="panel empty">読み込み中…</div>`; return; }
  const keep = {}; app.querySelectorAll("input[id],select[id],textarea[id]").forEach(el => keep[el.id] = el.value);
  const focusId = document.activeElement?.id;
  app.innerHTML = (S.demo ? `<div class="note">サンプルデータで表示しています（名前はすべて架空）。この画面での変更は保存されません。</div>` : "") + (S.view === "admin" ? adminHTML() : repPage());
  if (render.keep) {
    for (const [k, v] of Object.entries(keep)) { const el = document.getElementById(k); if (!el || el.value === v) continue; if (el.tagName === "SELECT" && ![...el.options].some(o => o.value === v)) continue; el.value = v; }
    if (focusId) document.getElementById(focusId)?.focus();
  }
  render.keep = false;
  bind();
}
function renderWho() {
  const w = $("#who");

/* 紹介者のログインIDを発行（管理者の画面から。管理者はログインしたまま） */
async function issueLogin(repId, id, pw) {
  id = id.trim().toLowerCase();
  if (!ID_OK.test(id)) return toast("IDは半角の英小文字・数字で3〜30文字にしてください");
  if (pw.length < 8) return toast("パスワードは8文字以上にしてください");
  const rep = repOf(repId); if (!rep) return;
  const { id: _i, updatedAt, ...base } = rep;
  if (S.demo) { await save("reps", repId, { ...base, uid: "demo-" + id, loginId: id }, true); S.issued = { repId, name: rep.name, id, pw }; render(); return; }
  S.busy = true;
  const app2 = initializeApp(FIREBASE_CONFIG, "issuer-" + Date.now()), a2 = getAuth(app2);
  try {
    const cred = await createUserWithEmailAndPassword(a2, loginEmail(id), pw);
    await setDoc(doc(fs, "members/" + cred.user.uid), { repId, loginId: id, createdAt: new Date().toISOString() });
    if (rep.uid && rep.uid !== cred.user.uid) { try { await deleteDoc(doc(fs, "members/" + rep.uid)); } catch {} }
    if (await save("reps", repId, { ...base, uid: cred.user.uid, loginId: id }, true)) S.issued = { repId, name: rep.name, id, pw };
  } catch (e) {
    const c = e?.code || "";
    toast(c.includes("email-already-in-use") ? "そのIDはすでに使われています。別のIDにしてください" : c.includes("weak-password") ? "パスワードが短すぎます" : "発行できませんでした。もう一度お試しください");
  } finally { try { await signOut(a2); } catch {} try { await deleteApp(app2); } catch {} S.busy = false; render(); }
}

}

/* 商材ごとの紹介料（この紹介者に適用される率）と試算 */
const EX = { monthly: 50000, once: 300000 };

    const example = !r ? "金額は案件ごとに決まります" : r.rewardType === "fixed" ? (once ? `1件成約で ${yen(r.fixed)}` : `1契約につき 毎月 ${yen(r.fixed)}`)
      : once ? `例：受注 ${yen(ex)} なら ${yen(f)}` : `例：月額 ${yen(ex)} なら 毎月 ${yen(f)}`;
    return `<div class="item ${once ? "o" : "m"}"><div class="main"><b>${esc(p.name)}</b>
      <div class="sub">${p.memo ? `<span>${esc(p.memo)}の</span>` : ""}<span>${r ? (r.rewardType === "fixed" ? "固定額" : r.rate + "%") : "—"}</span>${repRule(rep, p.id) ? `<span class="badge b-pending">あなた専用の率</span>` : ""}</div>
      <div class="sub">${example}</div></div>
      <div class="amt"><b class="num">${ruleText(r)}</b><span class="per">${r ? (once ? "1回" : "毎月") : ""}</span></div></div>`;
  }).join("");
  return `

function dealItem(x, admin, hideRep) {
  const p = prodOf(x.productId), r = rewardOf(x), once = x.kind === "once";
  const st = x.status === "pending" ? `<span class="badge b-pending">商談中</span>` : x.status === "lost" || (!once && x.endMonth && x.endMonth < nowYM) ? `<span class="badge b-end">終了</span>` : "";
  const period = once ? `${x.startMonth ? ymLabel(x.startMonth) : ""}` : `${x.startMonth ? ymLabel(x.startMonth) : ""}〜${x.endMonth ? ymLabel(x.endMonth) : ""}`;
  const tag = admin ? "button" : "div";
  return `<${tag} class="item ${once ? "o" : "m"} ${admin ? "click" : ""} ${st && x.status !== "pending" ? "dim" : ""}" ${admin ? `data-edit-deal="${esc(x.id)}"` : ""}>

      <div class="sub"><span>${period}</span>${qtyOf(x) > 1 ? `<span class="badge b-pending">× ${qtyOf(x)}</span>` : ""}${admin && !hideRep ? `<span>・${esc(repOf(x.repId)?.name || "—")}</span>` : ""}</div></div>
    <div class="amt"><b class="num">${yen(r)}</b><span class="per">${once ? "1回" : "毎月"}</span></div>
  </${tag}>`;
}

/* bars: monthly fee (継続 + 単発 stacked); line: running total */
function chartSVG(repId) {
  const narrow = innerWidth < 640, n = narrow ? 8 : 12;
  const months = []; for (let i = n - 1; i >= 0; i--) months.push(addM(nowYM, -i));
  const before = monthsUntilNow(repId).filter(m => m < months[0]).reduce((a, m) => a + repMonth(repId, m).total, 0);
  let run = before;
  const vals = months.map(m => { const r = repMonth(repId, m); run += r.total; return { m, ...r, cum: run }; });
  const cumu = S.chart === "cumu";
  const max = Math.max(1, ...vals.map(v => cumu ? v.cum : v.total));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const W = narrow ? 400 : 760, H = narrow ? 230 : 250, L = narrow ? 44 : 56, R = 10, T = 22, B = 30;
  const cw = (W - L - R) / months.length, bw = Math.min(34, cw * .58), y = v => T + (H - T - B) * (1 - v / top);
  const fmtAx = v => v >= 10000 ? (v / 10000).toLocaleString("ja-JP") + "万" : v.toLocaleString("ja-JP");
  let g = `<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D8BFF" stop-opacity=".45"/><stop offset="1" stop-color="#3D8BFF" stop-opacity="0"/></linearGradient></defs>`;
  for (let v = 0; v <= top + 1; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#222D45"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#6B7891" font-family="Manrope,sans-serif">${fmtAx(v)}</text>`;
  const cx = i => L + cw * i + cw / 2;
  if (cumu) {
    const pts = vals.map((v, i) => `${cx(i)},${y(v.cum)}`);
    g += `<path d="M${cx(0)},${y(0)} L${pts.join(" L")} L${cx(vals.length - 1)},${y(0)} Z" fill="url(#cg)"/>`;
    g += `<polyline points="${pts.join(" ")}" fill="none" stroke="#7DB8FF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = vals[vals.length - 1];
    g += `<circle cx="${cx(vals.length - 1)}" cy="${y(last.cum)}" r="5" fill="#7DB8FF" stroke="#060911" stroke-width="2"/>`;
    g += `<text x="${cx(vals.length - 1) - 8}" y="${y(last.cum) - 10}" text-anchor="end" font-size="13" font-weight="800" fill="#F2F5FA" font-family="Manrope,sans-serif">${yen(last.cum)}</text>`;
  } else {
    vals.forEach((v, i) => {
      const x = cx(i) - bw / 2, ys = y(v.stock), yo = y(v.stock + v.once), cur = v.m === nowYM;
      if (v.stock) g += `<rect x="${x}" y="${ys}" width="${bw}" height="${y(0) - ys}" rx="3" fill="#2FD9EC" ${cur ? 'fill-opacity=".55"' : ""}/>`;
      if (v.once) g += `<rect x="${x}" y="${yo}" width="${bw}" height="${ys - yo}" rx="3" fill="#FFB547" ${cur ? 'fill-opacity=".55"' : ""}/>`;
      if (cur) g += `<rect x="${x - 3}" y="${Math.min(yo, y(0) - 4) - 3}" width="${bw + 6}" height="${y(0) - Math.min(yo, y(0) - 4) + 3}" rx="5" fill="none" stroke="#7DB8FF" stroke-dasharray="3 3"/>`;
      if (cur && v.total) g += `<text x="${cx(i)}" y="${yo - 8}" text-anchor="middle" font-size="12" font-weight="800" fill="#F2F5FA" font-family="Manrope,sans-serif">${yen(v.total)}</text>`;
    });
  }
  vals.forEach((v, i) => { const [yy, mm] = v.m.split("-"); const cur = v.m === nowYM;
    g += `<text x="${cx(i)}" y="${H - B + 18}" text-anchor="middle" font-size="12" fill="${cur ? "#F2F5FA" : "#6B7891"}" font-weight="${cur ? 800 : 500}">${Number(mm)}月</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${cumu ? "紹介料の累計" : "月ごとの紹介料"}">${g}</svg>`;
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

function monthNav() {

function payHTML() {
  const d = data(), ym = S.month;
  const rows = d.reps.map(r => ({ r, ...repMonth(r.id, ym) })).filter(x => x.total || x.paid).sort((a, b) => b.total - a.total);
  const total = rows.reduce((a, x) => a + x.total, 0), paid = rows.filter(x => x.paid).reduce((a, x) => a + x.total, 0);
  /* past months that still have unpaid fees */
  const due = [];
  for (const r of d.reps) for (const m of monthsUntilNow(r.id)) { if (m >= nowYM) continue; const t = repMonth(r.id, m); if (t.total && !t.paid) due.push({ r, m, ...t }); }
  due.sort((a, b) => a.m.localeCompare(b.m));
  const dueSum = due.reduce((a, x) => a + x.total, 0);
  return `<section class="panel">
    <div class="head"><h2>${ic("wallet")}紹介料の支払い</h2>${monthNav()}</div>
    <div class="kpis">
      <div class="kpi"><div class="label">${ymLabel(ym)}の紹介料${ym >= nowYM ? "（見込み）" : ""}</div><div class="v">${yen(total)}</div></div>
      <div class="kpi good"><div class="label">支払い済み</div><div class="v">${yen(paid)}</div></div>
      <div class="kpi ${total - paid ? "bad" : ""}"><div class="label">まだ払っていない</div><div class="v">${yen(total - paid)}</div></div>
    </div>
    ${rows.length ? `<div class="rows">${rows.map(x => `<div class="item">
        <div class="main"><b>${esc(x.r.name)}</b><div class="sub">${x.stock ? `${kindTag("monthly")}<span class="num">${yen(x.stock)}</span>` : ""}${x.once ? `${kindTag("once")}<span class="num">${yen(x.once)}</span>` : ""}</div></div>
        <div class="amt"><b class="num">${yen(x.total)}</b>${x.paid ? `<span class="badge b-paid">${ic("check")}支払い済み ${fmtDate(x.paid.paidDate).slice(5)}</span>` : ym > nowYM ? `<span class="badge b-wait">見込み</span>` : ym === nowYM ? `<span class="badge b-wait">月末に確定</span>` : `<span class="badge b-due">未払い</span>`}</div>
        <div class="act">${x.paid ? `<button class="btn small ghost" data-unpay="${esc(payId(ym, x.r.id))}">支払い済みを取り消す</button>`
          : ym > nowYM ? "" : `<input type="date" class="dateinp" id="pd_${esc(x.r.id)}" value="${today()}" aria-label="支払った日"><button class="btn small good" data-pay="${esc(x.r.id)}" data-ym="${ym}">${ic("check", "sm")}支払い済みにする</button>`}
          <button class="btn small ghost" data-asrep="${esc(x.r.id)}">画面を見る</button></div>
      </div>`).join("")}</div>` : `<div class="empty">${ymLabel(ym)}に紹介料が発生する案件はありません</div>`}
  </section>
  <section class="panel">
    <div class="head"><h2>${ic("clock")}まだ払っていない紹介料（先月まで）</h2>${dueSum ? `<b class="num" style="color:var(--bad);font-size:18px">${yen(dueSum)}</b>` : ""}</div>
    ${due.length ? `<div class="rows">${due.map(x => `<div class="item"><div class="main"><b>${esc(x.r.name)}</b><div class="sub">${ymLabel(x.m)}分</div></div>
      <div class="amt"><b class="num">${yen(x.total)}</b><button class="btn small good" data-pay="${esc(x.r.id)}" data-ym="${x.m}">${ic("check", "sm")}支払い済みにする</button></div></div>`).join("")}</div>`
    : `<div class="empty">未払いはありません</div>`}
  </section>`;
}

      <div class="field"><label for="dProd">商材</label><select id="dProd">${d.products.map(p => `<option value="${esc(p.id)}" ${prod?.id === p.id ? "selected" : ""}>${esc(p.name)}（${p.kind === "once" ? "単発" : "継続"}）</option>`).join("")}</select></div>

      <div class="field"><label for="pName">商材名</label><input id="pName" required value="${esc(ep.name || "")}" placeholder="例：デジタル名刺"></div>
      <div class="field"><label for="pKind">種類</label><select id="pKind"><option value="monthly" ${ep.kind !== "once" ? "selected" : ""}>継続（契約中は毎月）</option><option value="once" ${ep.kind === "once" ? "selected" : ""}>単発（成約時に1回）</option></select></div>
      <div class="field"><label for="pVal">標準の紹介料</label><div class="pair"><select id="pType" aria-label="決め方"><option value="rate" ${pt === "rate" ? "selected" : ""}>％</option><option value="fixed" ${pt === "fixed" ? "selected" : ""}>固定額</option><option value="none" ${pt === "none" ? "selected" : ""}>案件ごと</option></select><input id="pVal" type="number" min="0" step="any" value="${esc(pt === "fixed" ? ep.fixed ?? "" : pt === "rate" ? ep.rate ?? "" : "")}"></div></div>
      <div class="field"><label for="pMemo">何に対する紹介料か</label><input id="pMemo" value="${esc(ep.memo || "")}" placeholder="例：月額利用料"></div>
      <div class="btns"><button class="btn primary" type="submit">${ep.id ? "変更を保存" : "商材を追加"}</button>
        ${ep.id ? `<button class="btn ghost" type="button" id="pCancel">キャンセル</button><button class="btn danger" type="button" data-del="products:${esc(ep.id)}">${S.confirmDel === "products:" + ep.id ? "本当に削除する" : "削除"}</button>` : ""}</div>
    </form>
    ${d.products.length ? `<div class="rows" style="margin-top:16px">${d.products.map(p => { const r = productRule(p), once = p.kind === "once";
      return `<button class="item click ${once ? "o" : "m"}" data-edit-prod="${esc(p.id)}"><div class="main"><b>${esc(p.name)}</b><div class="sub">${kindTag(p.kind)}<span>${esc(p.memo || "")}</span></div></div><div class="amt"><b class="num">${ruleText(r)}</b><span class="per">${r ? (once ? "1回" : "毎月") : ""}</span></div></button>`; }).join("")}</div>` : `<div class="empty">まだ商材がありません</div>`}
  </section>
  ${pwPanelHTML("管理者のパスワードを変更" + (S.adminLoginId ? `（ID：${esc(S.adminLoginId)}）` : ""))}
  <details class="panel"><summary>${ic("box")}データの取り込み</summary>
    <p class="label" style="margin:0 0 12px">移行用のデータファイル（.json）を選ぶと、まだ入っていない商材・紹介者などを追加します。すでにあるデータは上書きしません。</p>
    <input type="file" id="importFile" accept="application/json,.json">
  </details>`;
}

/* ---------- events ---------- */
function bind() {
  const on = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.onclick = ev => fn(el, ev));
  on("[data-tab]", b => { S.tab = b.dataset.tab; S.confirmDel = null; render(); window.scrollTo(0, 0); });
  on("[data-m]", b => { const n = +b.dataset.m; S.month = n ? addM(S.month, n) : nowYM; render(); });
  on("[data-chart]", b => { S.chart = b.dataset.chart; render(); });
  on("[data-drep]", b => { S.dealRep = b.dataset.drep; render(); });
  { const nb = $("#dNew"); if (nb) nb.onclick = () => { S.dealForm = true; S.editDeal = null; render(); window.scrollTo(0, 0); $("#dClient")?.focus(); }; }
  on("[data-reptab]", b => { S.repTab = b.dataset.reptab; render(); window.scrollTo(0, 0); });
  const cf = $("#calcForm");
  if (cf) {
    const rep = repOf(S.isAdmin ? S.viewRepId : S.myRepId);
    const cupd = () => {
      const p = prodOf($("#cProd").value), once = p?.kind === "once", r = repRule(rep, p?.id) || productRule(p), amt = Number($("#cAmt").value) || 0;
      $("#cAmtL").textContent = once ? "受注金額（円）" : "月額（円）";
      $("#cAmt").placeholder = "例：" + EX[once ? "once" : "monthly"];
      $("#cAmt").disabled = r?.rewardType === "fixed";
      $("#cOut").innerHTML = !r ? `<span>この商材の紹介料は案件ごとに決まります</span>`
        : `${kindTag(once ? "once" : "monthly")}<span>あなたの紹介料</span><b>${yen(feeFor(r, amt))}</b><span>${once ? "（1回）" : "（契約中は毎月）"}${r.rewardType === "fixed" ? "・固定額" : `・${r.rate}%`}</span>`;
    };
    $("#cProd").onchange = cupd; $("#cAmt").oninput = cupd; cupd();
  }
  on("[data-asrep]", b => { S.view = "rep"; S.viewRepId = b.dataset.asrep; render(); window.scrollTo(0, 0); });
  const pwf = $("#pwForm"); if (pwf) pwf.onsubmit = ev => { ev.preventDefault(); changePassword($("#pwCur").value, $("#pwNew").value, $("#pwNew2").value); };
  const lgb = $("#lgIssue"); if (lgb) lgb.onclick = () => { if (!S.busy) issueLogin(S.editRep.id, $("#lgId").value, $("#lgPw").value); };
  const lgr = $("#lgRegen"); if (lgr) lgr.onclick = () => { $("#lgPw").value = genPw(); };
  const cpy = $("#issuedCopy"); if (cpy) cpy.onclick = async () => { const t = $("#issuedText").textContent; try { await navigator.clipboard.writeText(t); toast("コピーしました。LINEなどで紹介者に送ってください"); } catch { const r = document.createRange(); r.selectNodeContents($("#issuedText")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("文字を選択しました。長押しでコピーしてください"); } };
  const idone = $("#issuedDone"); if (idone) idone.onclick = () => { S.issued = null; S.editRep = null; render(); };
  const imp = $("#importFile"); if (imp) imp.onchange = () => { if (imp.files[0]) importJSON(imp.files[0]); };
  on("[data-pay]", async b => {
    if (S.busy) return; S.busy = true;
    const repId = b.dataset.pay, ym = b.dataset.ym, t = monthTotals(dealsOf(repId), ym);
    const date = document.getElementById("pd_" + repId)?.value || today();
    try { if (await save("payments", payId(ym, repId), { ym, repId, stock: t.stock, once: t.once, total: t.total, paid: true, paidDate: date })) toast(`${repOf(repId)?.name || ""}さんの${ymLabel(ym)}分 ${yen(t.total)} を支払い済みにしました`); }
    finally { S.busy = false; render(); }
  });
  on("[data-unpay]", async b => { if (await remove("payments", b.dataset.unpay)) toast("支払い済みを取り消しました"); });
  on("[data-edit-deal]", b => { S.editDeal = { ...data().deals.find(x => x.id === b.dataset.editDeal) }; S.confirmDel = null; render(); window.scrollTo(0, 0); });
  on("[data-edit-rep]", b => { S.issued = null; S.editRep = { ...repOf(b.dataset.editRep) }; S.confirmDel = null; render(); window.scrollTo(0, 0); });
  on("[data-edit-prod]", b => { S.editProduct = { ...prodOf(b.dataset.editProd) }; S.confirmDel = null; render(); $("#prodForm")?.scrollIntoView({ block: "center" }); });
  [["#dCancel", "editDeal"], ["#rCancel", "editRep"], ["#pCancel", "editProduct"]].forEach(([s, k]) => { const b = $(s); if (b) b.onclick = () => { S[k] = null; if (k === "editDeal") S.dealForm = false; S.confirmDel = null; render(); }; });
  on("[data-del]", async b => {
    const key = b.dataset.del;
    if (S.confirmDel !== key) { S.confirmDel = key; render(); return; }
    const [col, id] = key.split(":"); S.confirmDel = null;
    S[{ deals: "editDeal", reps: "editRep", products: "editProduct" }[col]] = null;
    if (await remove(col, id)) toast("削除しました"); render();
  });

  /* deal form */
  const df = $("#dealForm");
  if (df) {
    const upd = () => {
      const p = prodOf($("#dProd").value), once = p?.kind === "once", fixed = $("#dType").value === "fixed";
      $("#dAmountL").textContent = once ? "受注金額（1件あたり・円）" : "月額（1名・1契約あたり・円）";
      $("#dStartL").textContent = once ? "成約した月" : "支払いが始まる月";
      $("#dEndF").hidden = once;
      $("#dRate").placeholder = fixed ? "金額（円）" : "率（%）";
      const q = Math.max(1, Math.floor(Number($("#dQty").value) || 1));
      const r = rewardOf({ rewardType: fixed ? "fixed" : "rate", fixed: $("#dRate").value, rate: $("#dRate").value, amount: $("#dAmount").value, qty: q });
      $("#dCalc").innerHTML = `${kindTag(once ? "once" : "monthly")}<span>紹介料</span><b>${yen(r)}</b><span>${q > 1 ? `（${yen(r / q)} × ${q}）` : ""}${once ? "（1回）" : "（解約まで毎月）"}</span>`;
    };
    const applyDefault = () => {
      const r = defaultRule($("#dRep").value, prodOf($("#dProd").value));
      if (r) { $("#dType").value = r.rewardType; $("#dRate").value = r.rewardType === "fixed" ? r.fixed : r.rate; } else $("#dRate").value = "";
      upd();
    };
    $("#dProd").onchange = applyDefault; $("#dRep").onchange = applyDefault;
    ["#dAmount", "#dRate", "#dQty"].forEach(s => $(s).oninput = upd); $("#dType").onchange = upd;
    S.editDeal?.id ? upd() : applyDefault();
    df.onsubmit = async ev => {
      ev.preventDefault();
      const p = prodOf($("#dProd").value), fixed = $("#dType").value === "fixed", v = Number($("#dRate").value) || 0;
      const body = { repId: $("#dRep").value, productId: p.id, kind: p.kind, client: $("#dClient").value.trim(), amount: Number($("#dAmount").value) || 0, qty: Math.max(1, Math.floor(Number($("#dQty").value) || 1)),
        rewardType: fixed ? "fixed" : "rate", rate: fixed ? 0 : v, fixed: fixed ? v : 0, status: $("#dStatus").value, startMonth: $("#dStart").value,
        endMonth: p.kind === "once" ? "" : $("#dEnd").value, note: $("#dNote").value.trim() };
      if (body.endMonth && body.endMonth < body.startMonth) { toast("解約した月は、始まる月より後にしてください"); return; }
      if (await save("deals", S.editDeal?.id, body)) { toast(S.editDeal?.id ? "案件を更新しました" : `登録しました。紹介料 ${yen(rewardOf(body))}${p.kind === "once" ? "" : "/月"}`); S.editDeal = null; S.dealForm = false; render(); }
    };
  }

  /* referrer form */
  const rf = $("#repForm");
  if (rf) {
    rf.querySelectorAll("[data-rt]").forEach(sel => sel.onchange = () => { const inp = rf.querySelector(`[data-rv="${CSS.escape(sel.dataset.rt)}"]`); inp.disabled = !sel.value; if (!sel.value) inp.value = ""; else inp.focus(); });
    rf.onsubmit = async ev => {
      ev.preventDefault();
      const rates = {};
      rf.querySelectorAll("[data-rt]").forEach(sel => { const pid = sel.dataset.rt, v = rf.querySelector(`[data-rv="${CSS.escape(pid)}"]`).value; if (!sel.value || v === "") return; rates[pid] = sel.value === "fixed" ? { rewardType: "fixed", fixed: Number(v) } : { rewardType: "rate", rate: Number(v) }; });
      const prev = S.editRep?.id ? repOf(S.editRep.id) : null;
      const { id, updatedAt, ...base } = prev || {};
      if (await save("reps", S.editRep?.id, { ...base, name: $("#rName").value.trim(), memo: $("#rMemo").value.trim(), rates })) { toast(prev ? "紹介者を更新しました" : "紹介者を追加しました"); S.editRep = null; render(); }
    };
  }

  /* product form */
  const pf = $("#prodForm");
  if (pf) {
    const pupd = () => { const t = $("#pType").value; $("#pVal").disabled = t === "none"; $("#pVal").required = t !== "none"; $("#pVal").placeholder = t === "fixed" ? "金額（円）" : t === "rate" ? "率（%）" : ""; if (t === "none") $("#pVal").value = ""; };
    $("#pType").onchange = pupd; pupd();
    pf.onsubmit = async ev => {
      ev.preventDefault();
      const t = $("#pType").value, v = $("#pVal").value === "" ? null : Number($("#pVal").value);
      const prev = S.editProduct?.id ? prodOf(S.editProduct.id) : null;
      const { id, updatedAt, ...base } = prev || {};
      const body = { ...base, name: $("#pName").value.trim(), kind: $("#pKind").value, rewardType: t, rate: t === "rate" ? v : null, fixed: t === "fixed" ? v : null, memo: $("#pMemo").value.trim(),
        order: prev?.order ?? Math.max(0, ...data().products.map(p => p.order || 0)) + 1 };
      if (await save("products", prev?.id, body)) { toast(prev ? "商材を更新しました" : "商材を追加しました"); S.editProduct = null; render(); }
    };
  }
}
</script>
</body>
</html>
